services:
  updates:
    # 镜像名跟原 Python 版保持一致：NAS 上只需要 docker compose pull && up -d，
    # 不用改端口、不用改卷映射，替换是原地完成的。
    image: ghcr.io/wukaibo98/beikeshi-updates:latest
    container_name: bks-updates
    restart: unless-stopped
    ports:
      # NAS 端口:容器端口。改了左边，客户端里那两个地址也要跟着改
      - "50205:8080"
    environment:
      # 管理页口令走 .env（复制 .env.example 成 .env 再填），不写死在这里 ——
      # 这个文件是要进仓库的。${VAR:?消息} 的意思是"没有就直接报错停下"，
      # 免得稀里糊涂起一个谁也登不进管理页的服务。
      ADMIN_TOKEN: "${ADMIN_TOKEN:?请在 .env 里设置 ADMIN_TOKEN}"
      # 客户端拿清单时用的地址：内网一条、公网一条，客户端会自动挑
      LAN_BASE: "http://192.168.124.3:50205"
      PUBLIC_BASE: "https://bks.beikeshi.cn:54321"
      CHANNEL: "stable"
    volumes:
      # 数据库、密钥、程序包都在这一个目录里，备份就备份它
      - ./data:/data
    healthcheck:
      # scratch 镜像里没有 shell/curl，所以用二进制自己的子命令去探活
      test: ["CMD", "/bks-updates", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      # 不限的话 json 日志会一直长；发版频率低，5MB×3 足够回溯
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
